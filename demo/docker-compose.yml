services:
  aptly:
    build: .
    image: aptly-gui-demo/aptly:trixie
    ports:
      - "127.0.0.1:${APTLY_API_PORT:-8079}:8080"
    volumes:
      - aptly-data:/var/lib/aptly
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  gui:
    build:
      context: ..
    image: aptly-gui/aptly-gui:dev
    # Loopback only: these are demo credentials over plain HTTP.
    ports:
      - "127.0.0.1:${APTLY_GUI_PORT:-8078}:8080"
    environment:
      APTLY_API_URL: http://aptly:8080
      # Demo credentials. Set real ones, or configure OIDC, before exposing this.
      APTLY_GUI_ADMIN_USERNAME: admin
      APTLY_GUI_ADMIN_PASSWORD: heslo123
    volumes:
      - gui-data:/data
    depends_on:
      aptly:
        condition: service_healthy

volumes:
  aptly-data:
  gui-data:
